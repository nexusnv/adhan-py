version: 2
# NOTE: Dependabot opens PRs against the default branch (main).
# Security updates land like any other change — no retargeting needed.
updates:
  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "weekly"
    target-branch: "main"
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    target-branch: "main"

version: 2
# NOTE: target-branch applies to version updates only. Dependabot security
# updates always target the repository default branch, so any security PR
# opened against master must be retargeted to dev before merge.
updates:
  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "weekly"
    target-branch: "dev"
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    target-branch: "dev"
